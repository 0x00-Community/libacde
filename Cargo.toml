[workspace]
resolver = "3"
# wire: the session manager's control channel and the acompositor client protocols, shared by acdes and acdev's guest agent
members = ["wire"]
# vendor/blitz: the blitz fork (submodule), its own workspace
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2024"
repository = "http://gitea.dopamine/AC/libacde"

[workspace.dependencies]
acde-scene = { path = "scene", version = "=0.1.0", registry = "ac" }
acde-dirs = { path = "dirs", version = "=0.1.0", registry = "ac" }
# blitz: our fork (submodule vendor/blitz, Gitea AC/blitz), published to ac with the same names
blitz-dom = { path = "vendor/blitz/packages/blitz-dom", version = "=0.3.0-beta.5", registry = "ac", default-features = false }
blitz-paint = { path = "vendor/blitz/packages/blitz-paint", version = "=0.3.0-beta.5", registry = "ac", default-features = false }
blitz-traits = { path = "vendor/blitz/packages/blitz-traits", version = "=0.3.0-beta.5", registry = "ac", default-features = false }

# 对外唯一的包: src/ 下的模块 (host / render / runtime / webgl / …) (gpu 是 2D 场景、设备注册表和合成器接口, vello 是它在 wgpu 上的实现) 平铺导出 (Rust 用 rlib), 并以 cdylib 出 libacde.so
# (C 接口在 src/ffi.rs, 头文件 include/acde.h 由 build.rs 经 cbindgen 生成). acdev 和 acdes 并排检出本仓库, 以 path 依赖 "../libacde" 链它
[package]
name = "libacde"
version = "1.0.0"
edition.workspace = true
repository.workspace = true
license.workspace = true
publish = ["ac"]
# links: build.rs hands dependents the napi export list (DEP_ACDE_NAPI_DEF) for the executable that links this library on Windows
links = "acde"
# the package is the library: its sources, the header, the Wayland protocols, the page files build.rs bundles from js/ with
# manifest/, and the contract level src/host reads from acde-api/api-level
include = [
  "/src/**", "/build.rs", "/cbindgen.toml", "/include/**", "/protocol/**", "/js/tsconfig.json", "/js/bundle.ts", "/js/dom/src/**",
  "/js/page/src/**", "/js/launcher/src/**", "/manifest/**", "/acde-api/api-level", "/LICENSE",
]

[lib]
name = "acde"
crate-type = ["rlib", "cdylib"]

[dependencies]
acde-scene = { workspace = true }
# runtime/fs/workspace/userdirs.rs: the XDG user folders, one reading shared with acdes's manager and session (std only, no new crates)
acde-dirs = { workspace = true }
v8 = "=152.2.0"
log = { version = "=0.4.35", features = ["std"] }
# log: env_logger behind the log module (written on its own thread)
env_logger = { version = "=0.11.12", default-features = false }
# napi: the Node-API that the built-in napi modules link against
napi_sym = "=0.190.0"
parking_lot = "=0.13.0"
# model's #[napi(object)] (feature napi), runtime's exports
napi = { version = "=3.16.2", default-features = false, features = ["napi8", "async-runtime", "serde-json"] }
napi-derive = "=3.7.1"
# render: blitz is our fork, pinned and re-exported; acss and Parley come through blitz_dom (it re-exports them), so their types are the document's
blitz-dom = { workspace = true, features = ["svg", "woff", "system-fonts", "file-input", "text-transform-icu", "complex-scripts", "floats", "writing-mode"] }
blitz-paint = { workspace = true, default-features = true, features = ["scrollbars"] }
blitz-traits = { workspace = true, default-features = true }
html5ever = "=0.40.1"
data-url = "=0.3.2"
png = "=0.18.1"
# render: canvas measureText ink bounds from glyph boxes (the version blitz-dom uses)
skrifa = "=0.44.0"
bytemuck = "=1.25.2"
kurbo = "=0.13.1"
peniko = "=0.6.1"
# vello / webgl: wgpu on the same device as src/gpu
vello = { version = "=0.12.0", default-features = false, features = ["wgpu"] }
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "parking_lot", "wgsl", "naga-ir"] }
# webgpu: the page's descriptors deserialize straight into wgpu-types (src/host/webgpu/desc.rs)
wgpu-types = { version = "=30.0.2", features = ["serde"] }
pollster = "=0.4.0"
# webgl: src/webgl/glsl is naga's GLSL frontend with the WebGL dialect
naga = "=30.0.2"
unicode-xid = "=0.2.6"
# webgl: fast hashing for the per-draw object and cache maps (integer and small-struct keys)
rustc-hash = "=2.1.3"
# audio: ConvolverNode partitioned convolution and AnalyserNode spectra
realfft = "=3.5.1"
half = "=2.7.1"
thiserror = { version = "=2.0.21", default-features = false }
bitflags = "=2.13.2"
# runtime
jiff = "=0.2.46"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order", "float_roundtrip"] }
ntex = { version = "=4.9.3", features = ["rustls"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "=0.7.1"
aes = "=0.9.4"
cbc = { version = "=0.2.1", features = ["alloc"] }
async-channel = "=2.5.0"
futures-lite = "=2.6.1"
futures-channel = "=0.3.34"
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
async-io = "=2.6.0"
uuid = { version = "=1.29.3", features = ["v4"] }
icu_collator = "=2.4.0"
icu_locale_core = "=2.4.0"
# fs: everything under a root opens beneath the root's directory handle (openat2 on Linux, emulated elsewhere)
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
url = "=2.5.9"
sha1 = "=0.10.7"
sha2 = "=0.11.1"
hmac = "=0.13.0"
rand = "=0.10.4"
flate2 = "=1.1.11"
base64 = "=0.23.1"
# storage
rusqlite = { version = "=0.43.0", features = ["bundled"] }
indexmap = "=2.14.2"
# host
encoding_rs = "=0.8.44"
getrandom = "=0.4.3"
signal-hook = "=0.4.6"
symphonia = { version = "=0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "ogg", "vorbis", "flac", "aac", "isomp4"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["vulkan", "gles"] }
ash = "=0.38.0+1.3.281"
pipewire = { version = "=0.10.1", features = ["v0_3_49"] }
zbus = "=5.19.0"
roxmltree = "=0.21.2"
gstreamer = "=0.25.4"
gstreamer-app = "=0.25.2"
gstreamer-video = "=0.25.4"
gstreamer-audio = "=0.25.4"
gio = "=0.22.11"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["event", "fs", "process", "pty", "termios", "stdio", "thread"] }
libc = "=0.2.191"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "=0.18.2"

[target.'cfg(windows)'.dependencies]
# src/gpu: Direct3D 12 for the device WebGPU and the compositor share
wgpu = { version = "=30.0.2", default-features = false, features = ["dx12", "static-dxc"] }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# src/gpu: Metal for the device WebGPU and the compositor share
wgpu = { version = "=30.0.2", default-features = false, features = ["metal"] }
objc2 = "=0.6.5"
block2 = "=0.6.2"
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "objc2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSLocale", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-media", "objc2-core-video", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetResourceLoader", "AVAssetTrack", "AVAsynchronousKeyValueLoading", "AVMediaFormat", "AVAudioSettings", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase", "AVCaptureVideoDataOutput", "AVCaptureAudioDataOutput", "AVCaptureSession"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "objc2-core-video", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "CMTimeRange"] }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
# src/memory.rs: large blocks straight from the Mach VM
mach2 = "=0.6.0"

[dev-dependencies]
env_logger = "=0.11.12"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
naga = { version = "=30.0.2", features = ["msl-out", "spv-out", "hlsl-out"] }

[target.'cfg(windows)'.dev-dependencies]
socket2 = { version = "=0.6.5", features = ["all"] }

[features]
# model's #[napi(object)] derives (the napi crate itself is always there, runtime needs it)
napi = []
# render: blitz-dom's per-phase timings in the log
phase-times = ["blitz-dom/log-phase-times"]

[build-dependencies]
cbindgen = { version = "=0.29.4", default-features = false }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "s"
debug = 0
strip = true
lto = "thin"

[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
fontique = { path = "vendor/fontique" }
