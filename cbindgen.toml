language = "C"
include_guard = "ACDE_H"
autogen_warning = "/* Generated by cbindgen from src/ffi.rs (build.rs); do not edit. */"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true
cpp_compat = true

[parse]
parse_deps = false

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
sort_by = "None"
